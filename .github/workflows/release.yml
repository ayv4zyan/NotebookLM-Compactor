name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build extension zip
        run: |
          zip -r notebooklm-compactor.zip \
            manifest.json \
            LICENSE \
            TERMS.md \
            PRIVACY.md \
            SECURITY.md \
            background \
            content \
            lib \
            vendor \
            icons \
            -x "icons/*.plasmo.*.png"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: notebooklm-compactor.zip
          generate_release_notes: true